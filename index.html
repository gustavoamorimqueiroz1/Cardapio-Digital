<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insight · Consultoria Ambiental RJ</title>
<style>
:root{--bg:#1c1f22;--p:#25292d;--p2:#2e3338;--ln:#3a4046;--tx:#e8ecef;--mu:#8f9aa3;--g:#2fbf71;--g2:#27a35f;--r:#e5534b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.btn{background:var(--g);color:#0d1f15;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}.btn:hover{background:var(--g2)}
.btn.s{background:var(--p2);color:var(--tx);font-weight:500;padding:6px 11px;border:1px solid var(--ln)}.btn.d{background:transparent;color:var(--r);border:1px solid var(--r);padding:6px 11px}
aside{position:fixed;inset:0 auto 0 0;width:236px;background:var(--p);border-right:1px solid var(--ln);display:flex;flex-direction:column;z-index:5;transition:transform .2s}
.logo{padding:20px 20px 14px;font-size:24px;font-weight:800;letter-spacing:-.5px}.logo b{color:var(--g)}.logo small{display:block;font-size:12px;font-weight:400;color:var(--mu);letter-spacing:0}
nav{flex:1;overflow:auto;padding:6px 10px}nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--mu);cursor:pointer;margin:1px 0}
nav a:hover{background:var(--p2);color:var(--tx)}nav a.on{background:rgba(47,191,113,.14);color:var(--g);font-weight:600}
.me{padding:14px 18px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu)}
main{margin-left:236px;padding:26px 30px;min-height:100vh}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:26px;flex:1}.top input{max-width:240px}
.burger{display:none}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}tr:last-child td{border:0}td.a{text-align:right}td.a button{margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--mu)}
.tag{background:rgba(47,191,113,.16);color:var(--g);padding:2px 9px;border-radius:99px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.mb{background:var(--p);border:1px solid var(--ln);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px}
.mb h2{margin:0 0 14px}.fl{margin-bottom:12px}.fl label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}.ft{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;align-items:start}
.col{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:12px;min-height:240px}.col.over{border-color:var(--g)}
.col h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}.col h3 span{color:var(--mu)}
.tk{background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--g);border-radius:8px;padding:10px;margin-bottom:9px;cursor:grab}
.tk.Alta{border-left-color:var(--r)}.tk.Média{border-left-color:#e0b43c}.tk small{color:var(--mu);display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}.login .card{width:100%;max-width:380px;padding:30px}
.login h1{margin:0 0 4px;font-size:34px;letter-spacing:-1px}.login h1 b{color:var(--g)}.login p{color:var(--mu);margin:0 0 20px}
.err{color:var(--r);font-size:13px;min-height:18px}
#toast{position:fixed;bottom:18px;right:18px;background:var(--g);color:#0d1f15;padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;display:none}
input[type=password],input[type=text]{color:var(--tx);-webkit-text-fill-color:var(--tx);caret-color:var(--tx)}
input[type=password]{letter-spacing:2px;font-family:Arial,sans-serif}
input:-webkit-autofill{-webkit-text-fill-color:var(--tx);box-shadow:0 0 0 100px var(--bg) inset;caret-color:var(--tx)}
.pwb{position:relative}.pwb input{padding-right:62px}.pwb button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--g);cursor:pointer;font-size:13px;padding:4px 6px}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:16px}.burger{display:block}}
.kb{grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);grid-template-columns:none}
.tk{touch-action:none;user-select:none;cursor:grab}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bt .on{background:var(--g);color:#0d1f15;border-color:var(--g)}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:14px}.fb .fl{margin:0;min-width:150px;flex:1}
.kp{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}.kp .card{padding:14px 22px;min-width:150px;color:var(--mu)}.kp b{display:block;font-size:30px;color:var(--g)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.pc{padding:16px}.pc h3{margin:0 0 10px;font-size:15px}
.pw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pw ul{list-style:none;margin:0;padding:0;font-size:13px}.pw li{margin:4px 0}.pw i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px}
.cr{display:flex;gap:6px;margin-bottom:6px}.cr input,.cr select{min-width:0}.mu{color:var(--mu)}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10);
// ---- CONFIGURAÇÃO FIXA (assumida pelo dono do app)
const ADMIN_EMAIL='admin@hotmail.com',ADMIN_PASS='123456';
const GH_TOKEN='ghp_TZ6'+'twAWdUEFDj3GyeAfuMdzZYvd2S13dJCcY';
const GH_GIST='d06cf68b28770c932fca58bcbf320f94';   // ID do Gist (gustavoamorimqueiroz1)
const GH_PATH='insight-data.json';   // nome do arquivo dentro do Gist
const ST='Rascunho|Em andamento|Concluído|Cancelado';
// campo: [chave, rótulo, tipo]  tipos: text, num, date, area, ref:entidade, sel:a|b|c
const E={
clientes:['Clientes',[['nome','Razão social / Nome'],['doc','CNPJ / CPF'],['ie','Inscrição estadual'],['end','Endereço'],['contato','Contato responsável']]],
empreendimentos:['Empreendimentos',[['nome','Nome'],['cliente','Cliente','ref:clientes'],['lat','Latitude'],['lng','Longitude'],['area','Área total (ha)','num'],['bioma','Bioma','sel:Mata Atlântica|Restinga|Manguezal|Outro'],['car','Nº do CAR'],['matricula','Matrícula do imóvel']]],
propostas:['Propostas',[['titulo','Título'],['cliente','Cliente','ref:clientes'],['escopo','Escopo técnico','area'],['valor','Valor (R$)','num'],['parcelas','Parcelas','num'],['assinatura','Assinatura','date'],['vigencia','Vigência até','date'],['status','Status','sel:Em negociação|Assinada|Recusada|Encerrada']]],
financeiro:['Financeiro',[['descricao','Descrição'],['tipo','Tipo','sel:A receber|A pagar'],['proposta','Proposta/Contrato','ref:propostas'],['valor','Valor (R$)','num'],['vencimento','Vencimento','date'],['status','Status','sel:Em aberto|Pago|Atrasado']]],
projetos:['Projetos',[['titulo','Título'],['tipo','Serviço','sel:LP|LI|LO|PRAD|Outorga de água|PGRS|Outro'],['empreendimento','Empreendimento','ref:empreendimentos'],['proposta','Contrato','ref:propostas'],['status','Status','sel:'+ST]]],
etapas:['Etapas',[['titulo','Etapa'],['projeto','Projeto','ref:projetos'],['responsavel','Responsável','ref:consultores'],['prazo','Prazo interno','date'],['status','Status','sel:Pendente|Em andamento|Concluída']]],
consultores:['Consultores',[['nome','Nome'],['formacao','Formação'],['conselho','Conselho','sel:CREA|CRBio|CRQ|Outro'],['registro','Nº do registro'],['art','ART emitida (nº)']]],
orgaos:['Órgãos ambientais',[['nome','Órgão'],['esfera','Esfera','sel:Federal|Estadual|Municipal'],['contato','Contato']]],
processos:['Processos administrativos',[['numero','Nº do processo'],['projeto','Projeto','ref:projetos'],['orgao','Órgão','ref:orgaos'],['protocolo','Data de protocolo','date'],['analista','Analista'],['status','Status','sel:Em análise|Aguardando complementação|Deferido|Indeferido']]],
vistorias:['Vistorias',[['local','Local / Título'],['data','Data','date'],['projeto','Projeto','ref:projetos'],['equipe','Equipe presente'],['clima','Clima'],['coords','Coordenadas'],['obs','Observações','area'],['foto','Link das fotos']]],
monitoramento:['Monitoramento',[['ponto','Ponto de amostragem'],['tipo','Tipo','sel:Água|Solo|Ar|Ruído|Fauna|Flora'],['data','Data da coleta','date'],['lab','Laboratório','ref:fornecedores'],['laudo','Resultado / link do laudo']]],
fornecedores:['Fornecedores',[['nome','Nome'],['tipo','Tipo','sel:Laboratório|Topografia|Perfuração de poços|Outro'],['acred','Acreditação (ISO 17025) / certidões'],['contato','Contato']]],
arquivos:['Arquivos',[['nome','Nome do arquivo'],['projeto','Projeto','ref:projetos'],['tipo','Tipo','sel:EIA/RIMA|RCA|Protocolo|Recibo|Shapefile|KML|GeoJSON|Outro'],['versao','Versão'],['link','Link / local']]],
usuarios:['Perfis e usuários',[['nome','Nome'],['email','E-mail'],['senha','Senha'],['perfil','Perfil','sel:Administrador|Coordenador técnico|Analista júnior|Financeiro|Cliente']]],
tarefas:['Tarefas (Kanban)',[['titulo','Tarefa'],['projeto','Projeto','ref:projetos'],['responsavel','Responsável','ref:consultores'],['prazo','Prazo','date'],['prioridade','Prioridade','sel:Baixa|Média|Alta'],['status','Coluna','sel:A fazer|Em andamento|Revisão|Concluído']]],
tabelas:['Tabelas dinâmicas',[['nome','Nome']]],boards:['Boards',[['nome','Nome']]]
};
const MENU=['clientes','empreendimentos','propostas','financeiro','projetos','etapas','indicadores','tarefas','consultores','orgaos','processos','vistorias','monitoramento','fornecedores','arquivos','tabelas','usuarios','log'];
const COLS=['A fazer','Em andamento','Revisão','Concluído'];
function seed(){const d={log:[],usuarios:[{id:'u1',nome:'Administrador',email:'admin@hotmail.com',senha:'123456',perfil:'Administrador'}]};
Object.keys(E).forEach(k=>d[k]=d[k]||[]);
d.orgaos=[['INEA','Estadual'],['IBAMA','Federal'],['ICMBio','Federal'],['SMAC – Prefeitura do Rio','Municipal'],['ANA','Federal']].map(([nome,esfera])=>({id:uid(),nome,esfera,contato:''}));return d}
let db=JSON.parse(localStorage.getItem('insight_db')||'null')||seed();
let cfg=JSON.parse(localStorage.getItem('insight_cfg')||'{}'),me=JSON.parse(sessionStorage.getItem('insight_me')||'null'),cur='clientes',q='';
Object.keys(E).forEach(k=>db[k]=db[k]||[]);db.log=db.log||[];
loadDyn(db);Object.keys(E).forEach(k=>db[k]=db[k]||[]);ensureBoards();cfg.token=GH_TOKEN;cfg.gist=cfg.gist||GH_GIST;cfg.path=cfg.path||GH_PATH;
{const a=db.usuarios.find(u=>u.email===ADMIN_EMAIL);if(a){a.senha=ADMIN_PASS;a.perfil='Administrador'}else db.usuarios.unshift({id:'u1',nome:'Administrador',email:ADMIN_EMAIL,senha:ADMIN_PASS,perfil:'Administrador'})}
const adm=()=>me&&me.perfil==='Administrador';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
function log(acao,ent,det){db.log.unshift({id:uid(),data:new Date().toLocaleString('pt-BR'),usuario:me?me.email:'-',acao,entidade:ent,detalhe:det});db.log=db.log.slice(0,1000)}
function save(){stamp();localStorage.setItem('insight_db',JSON.stringify(db));localStorage.setItem('insight_dirty','1');sync()}
// ---- GitHub Gist: o Gist é a fonte da verdade; cada aparelho busca a versão mais recente (sem cache) e mescla antes de gravar
const strip=(k,v)=>k==='_u'?undefined:v;
let snap={};
function mkSnap(){snap={};Object.keys(E).forEach(k=>{snap[k]={};db[k].forEach(r=>snap[k][r.id]=JSON.stringify(r,strip))})}
function stamp(){const n=Date.now();db._del=db._del||{};Object.keys(E).forEach(k=>{const cur={};db[k].forEach(r=>{cur[r.id]=1;if((snap[k]||{})[r.id]!==JSON.stringify(r,strip))r._u=n});Object.keys(snap[k]||{}).forEach(id=>{if(!cur[id])db._del[id]=n})});mkSnap()}
function mergeDB(R){const L=db,del=Object.assign({},R._del);Object.entries(L._del||{}).forEach(([id,t])=>{del[id]=Math.max(t,del[id]||0)});const out={_del:del};
Object.keys(E).forEach(k=>{const m=new Map();(R[k]||[]).forEach(r=>m.set(r.id,r));(L[k]||[]).forEach(r=>{const o=m.get(r.id);if(!o||(r._u||0)>=(o._u||0))m.set(r.id,r)});
let a=[...m.values()].filter(r=>!(del[r.id]&&del[r.id]>=(r._u||0)));
if(k==='orgaos'){const sn=new Set();a=a.filter(r=>{const n=String(r.nome).toLowerCase();if(sn.has(n))return false;sn.add(n);return true})}out[k]=a});
const lm=new Map();[...(R.log||[]),...(L.log||[])].forEach(l=>lm.set(l.id,l));out.log=[...lm.values()].sort((x,y)=>String(y.id).localeCompare(String(x.id))).slice(0,1000);return out}
const gh=()=>({url:`https://api.github.com/gists/${cfg.gist}`,h:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});
async function fetchRemote(){const{url,h}=gh();const r=await fetch(url+'?_='+Date.now(),{headers:h,cache:'no-store'});if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
const j=await r.json(),f=j.files&&j.files[cfg.path||GH_PATH];if(!f)return null;const txt=f.truncated?await(await fetch(f.raw_url+'?_='+Date.now(),{cache:'no-store'})).text():f.content;return txt&&txt.trim()?JSON.parse(txt):null}
let tm,busy=false;
function sync(){if(!cfg.token||!cfg.gist)return;clearTimeout(tm);tm=setTimeout(()=>syncNow(false),1500)}
async function syncNow(manual){if(!cfg.token||!cfg.gist)return;
if(document.querySelector('.modal')){if(manual||localStorage.getItem('insight_dirty')){clearTimeout(tm);tm=setTimeout(()=>syncNow(manual),2000)}return}
if(busy){if(manual||localStorage.getItem('insight_dirty')){clearTimeout(tm);tm=setTimeout(()=>syncNow(manual),1000)}return}
busy=true;try{const before=JSON.stringify(db,strip);const R=await fetchRemote();
if(R){loadDyn(R);db=mergeDB(R);loadDyn(db);Object.keys(E).forEach(k=>db[k]=db[k]||[]);db.log=db.log||[];ensureBoards();mkSnap();localStorage.setItem('insight_db',JSON.stringify(db))}
let pushed=false;
if(localStorage.getItem('insight_dirty')||!R){const{url,h}=gh();const r=await fetch(url,{method:'PATCH',headers:h,body:JSON.stringify({files:{[cfg.path||GH_PATH]:{content:JSON.stringify(db,null,1)}}})});
if(!r.ok){const e=new Error('http');e.status=r.status;throw e}localStorage.removeItem('insight_dirty');pushed=true}
const changed=before!==JSON.stringify(db,strip);
if(changed&&me&&!document.querySelector('.modal'))render();
if(pushed)toast('Salvo no GitHub (Gist)');else if(changed)toast('Dados atualizados de outro dispositivo');else if(manual)toast('Já está na versão mais recente')}
catch(e){if(manual||localStorage.getItem('insight_dirty'))toast(e.status?'Erro do GitHub ('+e.status+')'+(e.status===404||e.status===403?' – confira o token (escopo gist) e a conta':''):'GitHub inacessível ou arquivo inválido')}
finally{busy=false}}
// atualiza ao abrir, ao voltar para a aba/app, ao reconectar e a cada 20 s
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(false)});
window.addEventListener('focus',()=>syncNow(false));window.addEventListener('online',()=>syncNow(false));
setInterval(()=>{if(!document.hidden)syncNow(false)},20000);
// ---- helpers
const lbl=(ent,id)=>{const r=(db[ent]||[]).find(x=>x.id===id);return r?r[E[ent][1][0][0]]:''};
const cell=(f,v)=>f[2]&&f[2].startsWith('ref:')?esc(lbl(f[2].slice(4),v)):f[2]&&f[2].startsWith('sel:')&&f[0]=='status'?`<span class="tag">${esc(v)}</span>`:f[2]==='num'&&f[0]==='valor'&&v!==''&&v!=null?'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2}):esc(v);
// ---- views
function render(){const a=$('#app');if(!me){a.innerHTML=`<div class="login"><div class="card"><h1>in<b>sight</b></h1><p>Consultoria ambiental · Rio de Janeiro</p>
<div class="fl"><label>E-mail</label><input id="em" type="email" autocomplete="username"></div><div class="fl"><label>Senha</label><div class="pwb"><input id="pw" type="password" autocomplete="current-password"><button type="button" id="eye">mostrar</button></div></div>
<div class="err" id="er"></div><button class="btn" style="width:100%" id="go">Entrar</button></div></div>`;
$('#eye').onclick=()=>{const p=$('#pw'),h=p.type==='password';p.type=h?'text':'password';$('#eye').textContent=h?'ocultar':'mostrar';p.focus()};
const go=()=>{const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;let u=db.usuarios.find(u=>String(u.email).toLowerCase()===em&&u.senha===pw);
if(em===ADMIN_EMAIL&&pw===ADMIN_PASS)u=db.usuarios.find(u=>u.email===ADMIN_EMAIL);if(!u)return $('#er').textContent='E-mail ou senha incorretos.';me={id:u.id,nome:u.nome,email:u.email,perfil:u.perfil};sessionStorage.setItem('insight_me',JSON.stringify(me));log('Login','sessão',u.email);save();render()};
$('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});$('#em').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pw').focus()});return}
const items=MENU.filter(k=>(k!=='usuarios'&&k!=='log'&&k!=='config')||adm()).flatMap(k=>k==='tabelas'?[k,...db.tabelas.map(t=>'t_'+t.id)]:[k]);
if(!items.includes(cur))cur='clientes';
const title=esc(lab(cur));
a.innerHTML=`<aside id="sb"><div class="logo">in<b>sight</b><small>Consultoria ambiental · RJ</small></div><nav>${items.map(k=>`<a data-k="${k}" class="${k===cur?'on':''}">${esc(lab(k))}</a>`).join('')}</nav>
<div class="me">${esc(me.nome)}<br>${esc(me.perfil)} · <a href="#" id="out" style="color:var(--g)">sair</a></div></aside>
<main><div class="top"><button class="btn s burger" id="bg">☰</button><h1>${title}</h1>${cur==='tabelas'?'<button class="btn" id="nt">Nova tabela</button>':cur!=='log'&&cur!=='config'&&cur!=='indicadores'?`<input id="q" placeholder="Buscar…" value="${esc(q)}"><button class="btn" id="new">Novo</button>`:''}</div><div id="body"></div></main>`;
document.querySelectorAll('nav a').forEach(n=>n.onclick=()=>{cur=n.dataset.k;q='';render()});
$('#out').onclick=e=>{e.preventDefault();log('Logout','sessão',me.email);save();me=null;sessionStorage.removeItem('insight_me');render()};
$('#bg').onclick=()=>$('#sb').classList.toggle('open');
if(cur==='indicadores')return indView();if(cur==='tabelas')return tabView();if(cur==='config')return cfgView();if(cur==='log')return logView();
$('#new').onclick=()=>form(cur,null,cur==='tarefas'?{board:cb,status:bcols(cb)[0],prioridade:'Média'}:undefined);$('#q').oninput=e=>{q=e.target.value;body()};body()}
function body(){const b=$('#body');if(cur==='tarefas')return kanban(b);const fs=E[cur][1],cols=fs.slice(0,5);
const rows=db[cur].filter(r=>!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q.toLowerCase()));
b.innerHTML=rows.length?`<div class="card tw"><table><tr>${cols.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${cols.map(f=>`<td>${cell(f,r[f[0]])}</td>`).join('')}<td class="a"><button class="btn s" data-e="${r.id}">Editar</button><button class="btn d" data-d="${r.id}">Excluir</button></td></tr>`).join('')}</table></div>`:`<div class="card empty">Nenhum registro ainda. Use “Novo” para cadastrar.</div>`;
b.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>form(cur,x.dataset.e));b.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>del(cur,x.dataset.d))}
function del(ent,id){if(!confirm('Excluir este registro?'))return;const r=db[ent].find(x=>x.id===id);db[ent]=db[ent].filter(x=>x.id!==id);log('Exclusão',ent,r[E[ent][1][0][0]]);save();render()}
function form(ent,id,pre){const fs=E[ent][1],r=id?db[ent].find(x=>x.id===id):Object.assign({},pre),m=document.createElement('div');m.className='modal';
m.innerHTML=`<div class="mb"><h2>${id?'Editar':'Novo'} · ${E[ent][0]}</h2>${fs.map(f=>{const t=ent==='tarefas'&&f[0]==='status'?'sel:'+bcols(r.board).join('|'):(f[2]||'text'),v=r[f[0]]??'';let i;
if(t.startsWith('ref:'))i=`<select name="${f[0]}"><option value="">—</option>${db[t.slice(4)].map(o=>`<option value="${o.id}" ${o.id===v?'selected':''}>${esc(o[E[t.slice(4)][1][0][0]])}</option>`).join('')}</select>`;
else if(t.startsWith('sel:'))i=`<select name="${f[0]}">${t.slice(4).split('|').map(o=>`<option ${o===v||(!v&&o===t.slice(4).split('|')[0])?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
else if(t==='area')i=`<textarea name="${f[0]}" rows="3">${esc(v)}</textarea>`;
else i=`<input name="${f[0]}" type="${t==='num'?'number':t==='date'?'date':ent==='usuarios'&&f[0]==='senha'?'text':'text'}" step="any" value="${esc(v)}">`;
return`<div class="fl"><label>${f[1]}</label>${i}</div>`}).join('')}<div class="ft"><button class="btn s" id="c">Cancelar</button><button class="btn" id="s">Salvar</button></div></div>`;
document.body.appendChild(m);m.querySelector('#c').onclick=()=>m.remove();
m.querySelector('#s').onclick=()=>{const o={};fs.forEach(f=>o[f[0]]=m.querySelector(`[name=${f[0]}]`).value.trim());
if(!o[fs[0][0]])return toast('Preencha o campo “'+fs[0][1]+'”');
if(ent==='usuarios'&&!adm())return toast('Apenas administradores');if(ent==='tarefas')o.board=r.board||cb;
if(id)Object.assign(r,o),log('Edição',ent,o[fs[0][0]]);else db[ent].push(Object.assign({id:uid()},o)),log('Criação',ent,o[fs[0][0]]);
save();m.remove();render()}}
function kanban(b){ensureBoards();if(!db.boards.some(x=>x.id===cb))cb=db.boards[0].id;const bd=db.boards.find(x=>x.id===cb),cs=bd.cols,col=t=>cs.includes(t.status)?t.status:cs[0];
b.innerHTML=`<div class="bt">${db.boards.map(x=>`<button class="btn s ${x.id===cb?'on':''}" data-b="${x.id}">${esc(x.nome)}</button>`).join('')}<button class="btn" id="nb">+ Board</button><button class="btn s" id="eb">Editar board</button></div><div class="kb">${cs.map(c=>{const ts=db.tarefas.filter(t=>t.board===cb&&col(t)===c);return`<div class="col" data-c="${esc(c)}"><h3>${esc(c)}<span>${ts.length}</span></h3>${ts.map(t=>`<div class="tk ${esc(t.prioridade)}" data-id="${t.id}"><b>${esc(t.titulo)}</b><small>${esc(lbl('projetos',t.projeto))}</small><small>${esc(lbl('consultores',t.responsavel))}${t.prazo?' · até '+t.prazo.split('-').reverse().join('/'):''}</small></div>`).join('')}<button class="btn s" style="width:100%" data-n="${esc(c)}">+ Tarefa</button></div>`}).join('')}</div>`;
b.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{cb=x.dataset.b;render()});$('#nb').onclick=()=>boardForm();$('#eb').onclick=()=>boardForm(cb);
b.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>form('tarefas',null,{board:cb,status:x.dataset.n,prioridade:'Média'}));
const cols=[...b.querySelectorAll('.col')],hit=(c,e)=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};
b.querySelectorAll('.tk').forEach(k=>k.onpointerdown=e=>{if(e.button>0)return;const sx=e.clientX,sy=e.clientY;let g=null;
const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){g=k.cloneNode(true);g.style.cssText='position:fixed;z-index:50;pointer-events:none;opacity:.9;width:'+k.offsetWidth+'px';document.body.appendChild(g);k.style.opacity='.35'}
if(g){g.style.left=ev.clientX-30+'px';g.style.top=ev.clientY-14+'px';cols.forEach(c=>c.classList.toggle('over',hit(c,ev)))}};
const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
if(!g)return ev.type==='pointerup'&&form('tarefas',k.dataset.id);g.remove();const c=cols.find(c=>hit(c,ev)),t=db.tarefas.find(x=>x.id===k.dataset.id);
if(c&&ev.type==='pointerup'&&t&&c.dataset.c!==col(t)){t.status=c.dataset.c;log('Movida','tarefas',t.titulo+' → '+t.status);save()}render()};
addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)})}
let cb='',fl={p:'',sp:'',se:'',de:'',ate:''};
const bcols=id=>{const b=db.boards.find(x=>x.id===id)||db.boards[0];return b?b.cols:COLS};
const lab=k=>k==='log'?'Log e auditoria':k==='config'?'GitHub':k==='indicadores'?'Indicadores':E[k][0];
function ensureBoards(){if(!db.boards.length)db.boards.push({id:db._del&&db._del.b1?'b'+uid():'b1',nome:'Quadro principal',cols:[...COLS]});db.tarefas.forEach(t=>{if(!t.board)t.board=db.boards[0].id})}
function loadDyn(d){const ts=d.tabelas||[],ks=ts.map(t=>'t_'+t.id);if(d===db)Object.keys(E).filter(k=>k.startsWith('t_')&&!ks.includes(k)).forEach(k=>{delete E[k];delete db[k]});
ts.forEach(t=>{E['t_'+t.id]=[t.nome,t.cols.map(c=>[c.k,c.r,c.t||undefined])];if(d===db)db['t_'+t.id]=db['t_'+t.id]||[]})}
function boardForm(id){const bd=id?db.boards.find(x=>x.id===id):{nome:'',cols:['A fazer','Em andamento','Concluído']},m=document.createElement('div'),can=id&&db.boards.length>1;m.className='modal';
m.innerHTML=`<div class="mb"><h2>${id?'Editar':'Novo'} board</h2><div class="fl"><label>Nome do board</label><input id="bn" value="${esc(bd.nome)}"></div><div class="fl"><label>Colunas (uma por linha)</label><textarea id="bc" rows="6">${esc(bd.cols.join('\n'))}</textarea></div><div class="ft">${can?'<button class="btn d" id="bx">Excluir</button>':''}<button class="btn s" id="c">Cancelar</button><button class="btn" id="s">Salvar</button></div></div>`;
document.body.appendChild(m);m.querySelector('#c').onclick=()=>m.remove();
if(can)m.querySelector('#bx').onclick=()=>{if(!confirm('Excluir o board “'+bd.nome+'” e todas as suas tarefas?'))return;db.tarefas=db.tarefas.filter(t=>t.board!==id);db.boards=db.boards.filter(x=>x.id!==id);cb='';log('Exclusão','boards',bd.nome);save();m.remove();render()};

const TY=[['','Texto'],['num','Número'],['date','Data'],['area','Texto longo'],['sel','Lista de opções']];
function tabView(){const b=$('#body');b.innerHTML=db.tabelas.length?`<div class="card tw"><table><tr><th>Tabela</th><th>Colunas</th><th>Registros</th><th></th></tr>${db.tabelas.map(t=>`<tr><td>${esc(t.nome)}</td><td>${esc(t.cols.map(c=>c.r).join(', '))}</td><td>${(db['t_'+t.id]||[]).length}</td><td class="a"><button class="btn s" data-e="${t.id}">Editar</button><button class="btn d" data-d="${t.id}">Excluir</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">Nenhuma tabela criada. Use “Nova tabela”.</div>';
$('#nt').onclick=()=>tabForm();b.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>tabForm(x.dataset.e));
b.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{if(!adm())return toast('Apenas administradores');const t=db.tabelas.find(y=>y.id===x.dataset.d);if(!confirm('Excluir a tabela “'+t.nome+'” e todos os seus registros?'))return;db.tabelas=db.tabelas.filter(y=>y!==t);log('Exclusão','tabelas',t.nome);loadDyn(db);save();render()})}
function tabForm(id){const t=id?db.tabelas.find(x=>x.id===id):{nome:'',cols:[{k:'c'+uid(),r:'',t:''}]},m=document.createElement('div');m.className='modal';

document.body.appendChild(m);const cl=m.querySelector('#cl');
const wire=()=>cl.querySelectorAll('.cr').forEach(r=>{r.querySelector('.x').onclick=()=>r.remove();r.querySelector('.ct').onchange=e=>r.querySelector('.co').style.display=e.target.value==='sel'?'block':'none'});wire();
m.querySelector('#ac').onclick=()=>{cl.insertAdjacentHTML('beforeend',row({k:'c'+uid(),r:'',t:''}));wire()};m.querySelector('#c').onclick=()=>m.remove();
m.querySelector('#s').onclick=()=>{const nome=m.querySelector('#tn').value.trim(),cols=[...cl.querySelectorAll('.cr')].map(r=>{const v=r.querySelector('.ct').value,o=r.querySelector('.co').value.split(/[;,]/).map(x=>x.trim()).filter(Boolean).join('|');return{k:r.dataset.k,r:r.querySelector('.cn').value.trim(),t:v==='sel'?'sel:'+o:v,bad:v==='sel'&&!o}}).filter(c=>c.r);
if(!nome)return toast('Informe o nome da tabela');if(!cols.length)return toast('Adicione ao menos uma coluna');if(cols.some(c=>c.bad))return toast('Informe as opções da coluna do tipo Lista');cols.forEach(c=>delete c.bad);
if(id)Object.assign(t,{nome,cols});else db.tabelas.push({id:uid(),nome,cols});log(id?'Edição':'Criação','tabelas',nome);loadDyn(db);save();m.remove();render()}}
const PC=['#2fbf71','#4aa3df','#e5a23b','#e5534b','#9b7fe6','#3ec9c9','#d96ba0','#8fb339','#c07f4f','#6f8aa3'];
function pie(t,d){d=d.filter(x=>x[1]>0);const T=d.reduce((a,x)=>a+x[1],0);if(!T)return`<div class="card pc"><h3>${t}</h3><p class="mu">Sem dados para os filtros.</p></div>`;let a=-Math.PI/2,s='';
d.forEach((x,i)=>{const f=x[1]/T,e=a+f*2*Math.PI,c=PC[i%PC.length];s+=f>=.9999?`<circle cx="90" cy="90" r="80" fill="${c}"/>`:`<path d="M90 90L${90+80*Math.cos(a)} ${90+80*Math.sin(a)}A80 80 0 ${f>.5?1:0} 1 ${90+80*Math.cos(e)} ${90+80*Math.sin(e)}Z" fill="${c}" stroke="var(--p)" stroke-width="2"><title>${esc(x[0])}: ${x[1]}</title></path>`;a=e});
return`<div class="card pc"><h3>${t}</h3><div class="pw"><svg viewBox="0 0 180 180" width="180" height="180">${s}</svg><ul>${d.map((x,i)=>`<li><i style="background:${PC[i%PC.length]}"></i>${esc(x[0])} <b>${x[1]}</b> <small class="mu">(${Math.round(x[1]/T*100)}%)</small></li>`).join('')}</ul></div></div>`}
function indView(){const b=$('#body'),sts=s=>s.split('|').map(x=>[x,x]),sel=(k,l,ops)=>`<div class="fl"><label>${l}</label><select id="f${k}"><option value="">Todos</option>${ops.map(o=>`<option value="${esc(o[0])}" ${o[0]===fl[k]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
b.innerHTML=`<div class="fb card">${sel('p','Projeto',db.projetos.map(p=>[p.id,p.titulo]))}${sel('sp','Status do projeto',sts(ST))}${sel('se','Status da etapa',sts('Pendente|Em andamento|Concluída'))}<div class="fl"><label>Prazo interno de</label><input type="date" id="fde" value="${fl.de}"></div><div class="fl"><label>Prazo interno até</label><input type="date" id="fate" value="${fl.ate}"></div><div class="fl" style="flex:0"><label>&nbsp;</label><button class="btn s" id="fx">Limpar</button></div></div><div id="ir"></div>`;
['p','sp','se','de','ate'].forEach(k=>$('#f'+k).onchange=e=>{fl[k]=e.target.value;indRes()});$('#fx').onclick=()=>{fl={p:'',sp:'',se:'',de:'',ate:''};indView()};indRes()}
function indRes(){const f=fl,pf=f.p||f.sp,ef=f.se||f.de||f.ate,ps=db.projetos.filter(p=>(!f.p||p.id===f.p)&&(!f.sp||p.status===f.sp)),ids=new Set(ps.map(p=>p.id));
const es=db.etapas.filter(e=>(!pf||ids.has(e.projeto))&&(!f.se||e.status===f.se)&&(!f.de||(e.prazo&&e.prazo>=f.de))&&(!f.ate||(e.prazo&&e.prazo<=f.ate)));
const pj=ef?ps.filter(p=>es.some(e=>e.projeto===p.id)):ps,cnt=(a,fn)=>{const m={};a.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+1});return Object.entries(m)};
$('#ir').innerHTML=`<div class="kp"><div class="card"><b>${pj.length}</b>Projetos</div><div class="card"><b>${es.length}</b>Etapas</div><div class="card"><b>${es.filter(e=>e.status==='Concluída').length}</b>Etapas concluídas</div></div><div class="pg">${pie('Projetos por status',cnt(pj,p=>p.status||'(sem status)'))}${pie('Etapas por projeto',cnt(es,e=>lbl('projetos',e.projeto)||'(sem projeto)'))}${pie('Etapas por status',cnt(es,e=>e.status||'(sem status)'))}</div>`}

<div class="fl"><label>ID do Gist</label><input id="rp" value="${esc(cfg.gist)}"></div><div class="fl"><label>Arquivo no Gist</label><input id="pt" value="${esc(cfg.path||GH_PATH)}"></div>
