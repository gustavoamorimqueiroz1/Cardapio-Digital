const firebaseConfig={apiKey:"AIzaSyBSG5VhSKUbHJ0UMkuBQPDJQhucdgY_ipQ",authDomain:"insight-5189f.firebaseapp.com",databaseURL:"https://insight-5189f-default-rtdb.firebaseio.com",projectId:"insight-5189f",storageBucket:"insight-5189f.firebasestorage.app",messagingSenderId:"858268463882",appId:"1:858268463882:web:5f2b2dd9f0a680a10600f3"};

['p','sp','se','de','ate'].forEach(k=>$('#f'+k).onchange=e=>{fl[k]=e.target.value;indRes()});$('#fx').onclick=()=>{fl={p:'',sp:'',se:'',de:'',ate:''};indView()};indRes()}
function indRes(){const f=fl,pf=f.p||f.sp,ef=f.se||f.de||f.ate,ps=db.projetos.filter(p=>(!f.p||p.id===f.p)&&(!f.sp||p.status===f.sp)),ids=new Set(ps.map(p=>p.id));
const es=db.etapas.filter(e=>(!pf||ids.has(e.projeto))&&(!f.se||e.status===f.se)&&(!f.de||(e.prazo&&e.prazo>=f.de))&&(!f.ate||(e.prazo&&e.prazo<=f.ate)));
const pj=ef?ps.filter(p=>es.some(e=>e.projeto===p.id)):ps,cnt=(a,fn)=>{const m={};a.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+1});return Object.entries(m)};
$('#ir').innerHTML=`<div class="kp"><div class="card"><b>${pj.length}</b>Projetos</div><div class="card"><b>${es.length}</b>Etapas</div><div class="card"><b>${es.filter(e=>e.status==='Concluída').length}</b>Etapas concluídas</div></div><div class="pg">${pie('Projetos por status',cnt(pj,p=>p.status||'(sem status)'))}${pie('Etapas por projeto',cnt(es,e=>lbl('projetos',e.projeto)||'(sem projeto)'))}${pie('Etapas por status',cnt(es,e=>e.status||'(sem status)'))}</div>`}

b.innerHTML=rows.length?`<div class="card tw"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th></th></tr>${rows.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${esc(PERFIS[u.perfil]||u.perfil)}</td><td><span class="tag ${u.ativo===false?'off':''}">${u.ativo===false?'Inativo':'Ativo'}</span></td><td class="a"><button class="btn s" data-e="${u.id}">Editar</button>${u.id===me.uid?'':`<button class="btn d" data-a="${u.id}">${u.ativo===false?'Ativar':'Inativar'}</button>`}</td></tr>`).join('')}</table></div>`:'<div class="card empty">Nenhum usuário.</div>';

async function toggleUser(id){const u=db.usuarios.find(x=>x.id===id);if(!u||!adm())return;const a=u.ativo===false;
try{await fb.db.ref('perfis/'+id+'/ativo').set(a);await R('usuarios/'+id+'/ativo').set(a);log(a?'Ativação':'Inativação','usuarios',u.email);toast(a?'Usuário ativado':'Usuário inativado')}catch(e){fail(e)}}
async function criarAuth(email){const app=firebase.initializeApp(firebaseConfig,'sec'+Date.now());
try{const A='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',pw=Array.from(crypto.getRandomValues(new Uint8Array(20)),x=>A[x%A.length]).join('');
const c=await app.auth().createUserWithEmailAndPassword(email,pw);await app.auth().signOut();return c.user.uid}finally{app.delete()}}
function userForm(id){if(!adm())return toast('Apenas administradores');const u=id?db.usuarios.find(x=>x.id===id):{nome:'',email:'',perfil:'analista'},self=id===me.uid,m=document.createElement('div');m.className='modal';
m.innerHTML=`<div class="mb"><h2>${id?'Editar':'Novo'} · Usuário</h2><div class="fl"><label>Nome</label><input id="un" value="${esc(u.nome)}"></div><div class="fl"><label>E-mail</label><input id="ue" type="email" value="${esc(u.email)}" ${id?'readonly':''}></div><div class="fl"><label>Perfil</label><select id="up" ${self?'disabled':''}>${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}" ${k===u.perfil?'selected':''}>${v}</option>`).join('')}</select></div>${id?'':'<p class="mu" style="font-size:13px">O usuário receberá um e-mail para criar a própria senha.</p>'}<div class="err" id="ur"></div><div class="ft"><button class="btn s" id="c">Cancelar</button><button class="btn" id="s">Salvar</button></div></div>`;
document.body.appendChild(m);m.querySelector('#c').onclick=()=>m.remove();
m.querySelector('#s').onclick=async()=>{const nome=m.querySelector('#un').value.trim(),email=m.querySelector('#ue').value.trim().toLowerCase(),perfil=self?u.perfil:m.querySelector('#up').value,er=m.querySelector('#ur'),bt=m.querySelector('#s');
if(!nome||!/^\S+@\S+\.\S+$/.test(email))return er.textContent='Informe o nome e um e-mail válido.';bt.disabled=true;
try{if(id){const d={nome,perfil};await fb.db.ref('perfis/'+id).update(d);await R('usuarios/'+id).update(d);log('Edição','usuarios',email)}
else{const k=await criarAuth(email),d={nome,email,perfil,ativo:true};await fb.db.ref('perfis/'+k).set({...d,empresa:EMP});await R('usuarios/'+k).set(d);try{await fb.auth.sendPasswordResetEmail(email)}catch(e){}log('Criação','usuarios',email);toast('Usuário criado. E-mail para definir a senha enviado.')}
m.remove()}catch(e){er.textContent=e.code==='auth/email-already-in-use'?'Este e-mail já está cadastrado.':e.code==='auth/invalid-email'?'E-mail inválido.':/permission/i.test(e.message||'')?'Sem permissão.':'Não foi possível salvar.';bt.disabled=false}}}
function pwdForm(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mb"><h2>Alterar senha</h2><div class="fl"><label>Senha atual</label><input id="p1" type="password" autocomplete="current-password"></div><div class="fl"><label>Nova senha (mín. 6 caracteres)</label><input id="p2" type="password" autocomplete="new-password"></div><div class="err" id="pe"></div><div class="ft"><button class="btn s" id="c">Cancelar</button><button class="btn" id="s">Alterar</button></div></div>`;
document.body.appendChild(m);m.querySelector('#c').onclick=()=>m.remove();
m.querySelector('#s').onclick=async()=>{const a=m.querySelector('#p1').value,n=m.querySelector('#p2').value,e=m.querySelector('#pe');if(!a)return e.textContent='Informe a senha atual.';if(n.length<6)return e.textContent='A nova senha precisa ter pelo menos 6 caracteres.';
try{const u=fb.auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,a));await u.updatePassword(n);m.remove();toast('Senha alterada')}catch(x){e.textContent=['auth/invalid-credential','auth/wrong-password'].includes(x.code)?'Senha atual incorreta.':'Falha ao alterar a senha.'}}}

function termsPage(kind='termos'){const docs={
termos:{title:'Termos de Uso',body:`<h2>1. Sobre a plataforma</h2><p>O INSIGHT é uma plataforma de apoio à gestão de consultorias e atividades ambientais, incluindo organização de clientes, empreendimentos, projetos, processos, documentos, tarefas, monitoramentos e indicadores.</p><h2>2. Acesso e responsabilidades</h2><p>O acesso é destinado a usuários autorizados pela organização contratante. Cada usuário deve manter suas credenciais em sigilo, utilizar senhas seguras e comunicar imediatamente qualquer suspeita de acesso indevido. As ações realizadas com uma conta são atribuídas a essa conta.</p><h2>3. Uso adequado</h2><p>O usuário compromete-se a inserir informações verdadeiras e lícitas, respeitar direitos de terceiros e não tentar acessar dados, contas ou áreas para as quais não tenha autorização. É proibido utilizar a plataforma para atividades ilícitas, comprometer sua disponibilidade ou contornar controles de segurança.</p><h2>4. Dados e conteúdo</h2><p>A organização cliente é responsável pela legitimidade, qualidade e atualização dos dados que cadastra e pelos perfis e permissões que concede aos seus colaboradores. O cliente deve possuir base legal adequada para inserir dados pessoais de terceiros.</p><h2>5. Disponibilidade e alterações</h2><p>São adotadas medidas razoáveis para manter a plataforma disponível e segura. Podem ocorrer interrupções para manutenção, atualização, correção ou por eventos externos. Funcionalidades podem evoluir, preservadas as obrigações contratuais e legais aplicáveis.</p><h2>6. Suspensão e encerramento</h2><p>O acesso poderá ser suspenso diante de uso indevido, risco à segurança, inadimplência quando aplicável ou determinação legal/contratual. O encerramento e a exportação ou eliminação de dados devem observar o contrato celebrado e a legislação aplicável.</p><h2>7. Contato</h2><p>Solicitações relacionadas à conta, uso ou suporte devem ser encaminhadas pelos canais oficiais informados pela empresa responsável pela contratação.</p>`},
privacidade:{title:'Política de Privacidade',body:`<h2>1. Quais dados podem ser tratados</h2><p>A plataforma pode tratar dados de cadastro e autenticação (nome, e-mail, empresa e perfil de acesso), informações inseridas nos módulos, arquivos anexados, registros técnicos de operação e dados necessários ao suporte e à segurança.</p><h2>2. Finalidades</h2><p>Os dados são utilizados para autenticar usuários, disponibilizar as funcionalidades contratadas, organizar informações ambientais e administrativas, controlar permissões, manter a integridade dos registros, prestar suporte, prevenir fraudes e cumprir obrigações legais.</p><h2>3. Compartilhamento</h2><p>O INSIGHT não comercializa dados pessoais nem os compartilha com terceiros para publicidade. O tratamento pode envolver fornecedores de infraestrutura e tecnologia estritamente necessários à hospedagem, autenticação, armazenamento, segurança e operação da plataforma, como serviços de nuvem, sempre limitado à finalidade contratada e sujeito às salvaguardas aplicáveis. Dados também poderão ser fornecidos quando houver obrigação legal, ordem válida de autoridade ou necessidade de exercício regular de direitos.</p><h2>4. Armazenamento e segurança</h2><p>São utilizados controles de autenticação, permissões por empresa e perfil, regras de acesso ao banco de dados e medidas técnicas e organizacionais destinadas a reduzir riscos de acesso não autorizado, perda, alteração ou divulgação indevida. Nenhum sistema conectado à internet pode garantir segurança absoluta.</p><h2>5. Retenção e eliminação</h2><p>Os dados são mantidos pelo período necessário à prestação do serviço, às finalidades informadas e ao cumprimento de obrigações legais ou contratuais. Após esse período, poderão ser eliminados ou anonimizados, ressalvadas hipóteses legítimas de conservação.</p><h2>6. Direitos dos titulares</h2><p>O titular pode solicitar, nos termos da legislação, confirmação do tratamento, acesso, correção, anonimização, bloqueio, eliminação quando cabível, portabilidade, informação sobre compartilhamentos e revisão de decisões automatizadas quando aplicável. A solicitação poderá exigir validação de identidade.</p><h2>7. Atualizações</h2><p>Esta política poderá ser atualizada para refletir mudanças legais, técnicas ou operacionais. A versão vigente ficará disponível nesta página.</p>`},
lgpd:{title:'Privacidade e LGPD',body:`<h2>1. Compromisso com a LGPD</h2><p>O tratamento de dados pessoais realizado por meio do INSIGHT deve observar a Lei nº 13.709/2018 (Lei Geral de Proteção de Dados Pessoais – LGPD), incluindo os princípios da finalidade, adequação, necessidade, transparência, segurança, prevenção e responsabilização.</p><h2>2. Papéis no tratamento</h2><p>Em regra, a organização cliente define as finalidades e os meios essenciais do tratamento dos dados pessoais que cadastra na plataforma, atuando como controladora. O fornecedor do INSIGHT poderá atuar como operador desses dados, conforme as instruções e o contrato aplicável. Para dados tratados para administrar a própria relação comercial, segurança e suporte, o fornecedor poderá atuar como controlador, conforme o caso concreto.</p><h2>3. Bases legais e minimização</h2><p>A organização cliente deve assegurar uma base legal adequada para cada operação de tratamento e cadastrar apenas os dados necessários à finalidade pretendida. O sistema não deve ser utilizado para armazenar dados pessoais excessivos ou sem justificativa.</p><h2>4. Segurança e incidentes</h2><p>São adotadas medidas técnicas e administrativas proporcionais aos riscos para proteger dados pessoais. Suspeitas de incidente devem ser comunicadas sem demora pelos canais de suporte, para avaliação, contenção e adoção das providências cabíveis, inclusive comunicações legalmente exigidas.</p><h2>5. Solicitações dos titulares</h2><p>Pedidos de titulares devem ser encaminhados à organização responsável pelo tratamento. Quando o fornecedor atuar como operador, apoiará o cliente, dentro das possibilidades técnicas e contratuais, no atendimento das solicitações.</p><h2>6. Transferência e fornecedores</h2><p>O uso de provedores de infraestrutura pode envolver processamento ou armazenamento em ambientes operados por fornecedores especializados, inclusive fora do país, conforme a configuração dos serviços contratados. Quando aplicável, deverão ser observados os requisitos legais para transferência internacional e as salvaguardas pertinentes.</p><h2>7. Canal de contato</h2><p>Para dúvidas ou solicitações sobre privacidade e proteção de dados, utilize o canal de contato informado pela organização contratante ou pelo fornecedor do INSIGHT.</p>`}};const d=docs[kind]||docs.termos;$('#app').innerHTML=`<main class="terms-page"><a href="javascript:window.close()" class="muted">Fechar esta aba</a><h1>${d.title}</h1><p class="muted">Última atualização: 16 de novembro de 2026</p>${d.body}<p class="muted">Este texto é informativo e deve ser ajustado aos contratos, fornecedores, práticas efetivas e canais oficiais do operador da plataforma antes da publicação como documento jurídico definitivo.</p></main>`}

let SA={profiles:{},companies:[],user:null,filtro:'',tab:'usuarios',logsEmp:{}};

function isSuperadminRoute(){
  return /\/admin\/?$/.test(location.pathname)
      || new URLSearchParams(location.search).get('pagina')==='admin'
      || location.hash==='#admin';
}

/* 1. Tela de Login do Superadmin (sem botão de voltar para o login principal) */
function saLoginView(msg=''){
  $('#app').innerHTML=`
    <div class="login">
      <div>
        <div class="card">
          <h1>in<b>sight</b></h1>
          <p>Acesso restrito · Superadmin</p>
          <div class="fl">
            <label>E-mail do Superadmin</label>
            <input id="saEmail" type="email" autocomplete="username">
          </div>
          <div class="fl">
            <label>Senha</label>
            <div class="pwb">
              <input id="saPass" type="password" autocomplete="current-password">
              <button type="button" id="saEye">mostrar</button>
            </div>
          </div>
          <div class="err" id="saError" style="margin-bottom:10px;white-space:pre-wrap">${esc(msg)}</div>
          <button type="button" class="btn" id="saEnter" style="width:100%">Entrar no Painel Superadmin</button>
        </div>
      </div>
    </div>
  `;

  $('#saEye').onclick=()=>{
    const p=$('#saPass'),h=p.type==='password';
    p.type=h?'text':'password';
    $('#saEye').textContent=h?'ocultar':'mostrar';
    p.focus();
  };

  const autenticarSuperadmin=async()=>{
    const email=$('#saEmail').value.trim().toLowerCase();
    const senha=$('#saPass').value;
    const err=$('#saError');
    const btn=$('#saEnter');

    err.style.color='var(--r)';
    err.textContent='';
    if(!email||!senha){
      err.textContent='Informe o e-mail e a senha.';
      return;
    }

    btn.disabled=true;
    btn.textContent='Autenticando...';

    try{
      await fb.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
      const cred=await fb.auth.signInWithEmailAndPassword(email,senha);
      const uidLogado=cred.user.uid;

      btn.textContent='Verificando permissão...';
      const snap=await fb.db.ref('perfis/'+uidLogado).get();
      const perfil=snap.val();

      if(!perfil){
        await fb.auth.signOut();
        throw new Error('Perfil não encontrado no banco para o UID: '+uidLogado);
      }
      if(perfil.perfil!=='superadmin'){
        await fb.auth.signOut();
        throw new Error('Acesso negado: o perfil cadastrado é "'+perfil.perfil+'", mas precisa ser "superadmin".');
      }
      if(perfil.ativo===false){
        await fb.auth.signOut();
        throw new Error('Esta conta de superadmin está inativa.');
      }

      SA.user={uid:uidLogado,email:perfil.email||cred.user.email,nome:perfil.nome||'Superadmin'};
      SA.tab='usuarios';
      await saCarregarUsuarios();
    }catch(e){
      const detalhe=e&&e.code?erroAuth(e)+' ('+e.code+')':(e&&e.message?e.message:String(e));
      err.textContent=detalhe;
      btn.disabled=false;
      btn.textContent='Entrar no Painel Superadmin';
    }
  };

  $('#saEnter').addEventListener('click',autenticarSuperadmin);
  $('#saPass').addEventListener('keydown',e=>{if(e.key==='Enter')autenticarSuperadmin()});
  $('#saEmail').addEventListener('keydown',e=>{if(e.key==='Enter')$('#saPass').focus()});
}

/* 2. Carregamento dos usuários e logs agrupados por empresa */
async function saCarregarUsuarios(){
  $('#app').innerHTML='<div class="login"><p class="mu">Carregando dados da plataforma…</p></div>';
  try{
    const raw=(await fb.db.ref('perfis').get()).val()||{};
    SA.profiles=raw;

    const empresaIds=[...new Set(
      Object.values(raw)
        .filter(x=>x&&x.perfil!=='superadmin'&&x.empresa)
        .map(x=>String(x.empresa).trim().toLowerCase())
    )].sort();

    SA.companies=await Promise.all(empresaIds.map(async id=>{
      let info={},logs=[];
      try{info=(await fb.db.ref('empresas/'+id+'/info').get()).val()||{}}catch(e){}
      try{
        const lVal=(await fb.db.ref('empresas/'+id+'/log').limitToLast(200).get()).val();
        logs=arr(lVal).sort((a,b)=>(b.ts||0)-(a.ts||0));
      }catch(e){}

      const users=Object.entries(raw)
        .filter(([uid,p])=>p&&p.perfil!=='superadmin'&&String(p.empresa||'').trim().toLowerCase()===id)
        .map(([uid,p])=>({...p,uid}))
        .sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||'')));

      return{id,nome:info.nome||id,users,logs};
    }));

    saRenderPainel();
  }catch(e){
    $('#app').innerHTML=`
      <div class="admin-wrap">
        <div class="card">
          <h2>Erro ao carregar dados do Superadmin</h2>
          <p class="mu">Verifique as regras do Firebase Realtime Database para <code>/perfis</code> e <code>/empresas</code>.</p>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn" id="saRetry">Tentar novamente</button>
            <button class="btn s" id="saLogoutErr">Sair</button>
          </div>
        </div>
      </div>
    `;
    $('#saRetry').onclick=()=>saCarregarUsuarios();
    $('#saLogoutErr').onclick=()=>saSair();
  }
}

/* 3. Renderização do Painel Superadmin (Usuários por empresa + Log e auditoria) */
function saRenderPainel(){
  const termo=SA.filtro.trim().toLowerCase();

  let conteudoHtml='';
  if(SA.tab==='log'){
    const gruposLogs=SA.companies.map(c=>{
      const logs=c.logs.filter(l=>!termo||JSON.stringify([c.nome,c.id,l.data,l.usuario,l.acao,l.entidade,l.detalhe]).toLowerCase().includes(termo));
      return{...c,logs};
    }).filter(c=>!termo||c.logs.length>0);

    conteudoHtml=gruposLogs.map(c=>`
      <section class="card company-group">
        <h3>
          <span>Empresa: ${esc(c.nome)} <small class="mu">(chave: ${esc(c.id)})</small></span>
          <small class="mu">${c.logs.length} registro(s) de log</small>
        </h3>
        <div class="tw">
          <table>
            <thead>
              <tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Módulo</th><th>Detalhe</th></tr>
            </thead>
            <tbody>
              ${c.logs.length?c.logs.map(l=>`
                <tr>
                  <td>${esc(l.data||'—')}</td>
                  <td>${esc(l.usuario||'—')}</td>
                  <td><span class="tag">${esc(l.acao||'—')}</span></td>
                  <td>${esc(l.entidade||'—')}</td>
                  <td>${esc(l.detalhe||'—')}</td>
                </tr>
              `).join(''):'<tr><td colspan="5" class="mu">Nenhum registro de auditoria para esta empresa.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
    `).join('')||'<div class="card empty">Nenhum registro de log encontrado.</div>';
  }else{
    const gruposFiltrados=SA.companies.map(c=>{
      const users=c.users.filter(u=>{
        if(!termo)return true;
        return String(c.nome+' '+c.id+' '+(u.nome||'')+' '+(u.email||'')+' '+(u.perfil||'')).toLowerCase().includes(termo);
      });
      return{...c,users};
    }).filter(c=>!termo||c.users.length>0);

    conteudoHtml=gruposFiltrados.map(c=>`
      <section class="card company-group">
        <h3>
          <span>Empresa: ${esc(c.nome)} <small class="mu">(chave: ${esc(c.id)})</small></span>
          <small class="mu">${c.users.length} usuário(s)</small>
        </h3>
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Status</th>
                <th style="text-align:right">Ação</th>
              </tr>
            </thead>
            <tbody>
              ${c.users.length?c.users.map(u=>{
                const ativo=u.ativo===true;
                return`
                  <tr>
                    <td>${esc(u.nome||'—')}</td>
                    <td>${esc(u.email||'—')}</td>
                    <td>${esc(PERFIS[u.perfil]||u.perfil||'—')}</td>
                    <td><span class="tag ${ativo?'':'off'}">${ativo?'Ativo':'Inativo'}</span></td>
                    <td class="a">
                      <button class="btn ${ativo?'d':'s'}" data-sa-toggle="${esc(u.uid)}">
                        ${ativo?'Inativar':'Ativar'}
                      </button>
                    </td>
                  </tr>
                `;
              }).join(''):'<tr><td colspan="5" class="mu">Nenhum usuário vinculado a esta empresa.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
    `).join('')||'<div class="card empty">Nenhum usuário encontrado. Clique em “+ Criar usuário” para cadastrar.</div>';
  }

  $('#app').innerHTML=`
    <header class="sa-header">
      <b>in<span>sight</span> · Painel Superadmin</b>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="mu" style="font-size:13px">${esc(SA.user?.email||'')}</span>
        <button class="btn" id="saNewUser">+ Criar usuário</button>
        <button class="btn s" id="saOut">Sair</button>
      </div>
    </header>
    <div class="admin-wrap">
      <div class="bt">
        <button class="btn s ${SA.tab==='usuarios'?'on':''}" id="saTabUsers">Usuários por empresa</button>
        <button class="btn s ${SA.tab==='log'?'on':''}" id="saTabLogs">Log e auditoria</button>
      </div>
      <div class="sa-toolbar">
        <div>
          <h1 style="margin:0;font-size:26px">${SA.tab==='log'?'Log e auditoria por empresa':'Usuários por empresa'}</h1>
          <p class="mu" style="margin:4px 0 0">${SA.tab==='log'?'Histórico de ações registradas nas empresas.':'Usuários inativados são bloqueados imediatamente no login principal.'}</p>
        </div>
        <input id="saSearch" type="text" placeholder="Filtrar…" value="${esc(SA.filtro)}">
      </div>
      ${conteudoHtml}
    </div>
  `;

  $('#saTabUsers').onclick=()=>{SA.tab='usuarios';saRenderPainel()};
  $('#saTabLogs').onclick=()=>{SA.tab='log';saRenderPainel()};
  $('#saNewUser').onclick=()=>saAbrirModalCriarUsuario();
  $('#saOut').onclick=()=>saSair();

  const searchInput=$('#saSearch');
  searchInput.oninput=e=>{
    SA.filtro=e.target.value;
    const pos=searchInput.selectionStart;
    saRenderPainel();
    const novoInput=$('#saSearch');
    if(novoInput){novoInput.focus();novoInput.setSelectionRange(pos,pos);}
  };

  document.querySelectorAll('[data-sa-toggle]').forEach(btn=>{
    btn.onclick=()=>saAlternarStatusUsuario(btn.dataset.saToggle);
  });
}

/* 4. Inativar / Ativar usuário */
async function saAlternarStatusUsuario(targetUid){
  const p=SA.profiles[targetUid];
  if(!p)return;
  const novoStatus=p.ativo!==true;

  try{
    await fb.db.ref('perfis/'+targetUid+'/ativo').set(novoStatus);
    const emp=String(p.empresa||'').trim().toLowerCase();
    if(emp){
      await fb.db.ref('empresas/'+emp+'/usuarios/'+targetUid+'/ativo').set(novoStatus);
    }
    toast(novoStatus?'Usuário ativado com sucesso.':'Usuário inativado. Acesso principal bloqueado.');
    await saCarregarUsuarios();
  }catch(e){
    fail(e);
  }
}

/* 5. Criar novo usuário via instância secundária do Firebase Auth */
async function saCriarContaAuth(email,senhaInicial){
  const app=firebase.initializeApp(firebaseConfig,'sa-create-'+Date.now());
  try{
    const cred=await app.auth().createUserWithEmailAndPassword(email,senhaInicial);
    await app.auth().signOut();
    return cred.user.uid;
  }finally{
    await app.delete();
  }
}

function saAbrirModalCriarUsuario(){
  const m=document.createElement('div');
  m.className='modal';
  m.innerHTML=`
    <div class="mb">
      <h2>Novo usuário por empresa</h2>
      <div class="fl">
        <label>Chave da empresa (ex.: insight, empresa-rj)</label>
        <input id="saCompany" placeholder="Digite ou selecione a empresa" list="saCompaniesList">
        <datalist id="saCompaniesList">
          ${SA.companies.map(c=>`<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('')}
        </datalist>
      </div>
      <div class="fl">
        <label>Nome completo</label>
        <input id="saName" placeholder="Nome do usuário">
      </div>
      <div class="fl">
        <label>E-mail de acesso</label>
        <input id="saMail" type="email" placeholder="usuario@empresa.com.br">
      </div>
      <div class="fl">
        <label>Senha inicial (opcional — se vazio, envia link de criação por e-mail)</label>
        <input id="saInitPass" type="text" placeholder="Mínimo 6 caracteres (ou deixe em branco)">
      </div>
      <div class="fl">
        <label>Perfil de acesso</label>
        <select id="saRole">
          ${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}
        </select>
      </div>
      <div class="err" id="saFormErr"></div>
      <div class="ft">
        <button type="button" class="btn s" id="saCancel">Cancelar</button>
        <button type="button" class="btn" id="saSave">Criar usuário</button>
      </div>
    </div>
  `;
  document.body.appendChild(m);

  m.querySelector('#saCancel').onclick=()=>m.remove();
  m.querySelector('#saSave').onclick=async()=>{
    const empresa=m.querySelector('#saCompany').value.trim().toLowerCase();
    const nome=m.querySelector('#saName').value.trim();
    const email=m.querySelector('#saMail').value.trim().toLowerCase();
    const senhaDigitada=m.querySelector('#saInitPass').value.trim();
    const perfil=m.querySelector('#saRole').value;
    const er=m.querySelector('#saFormErr');
    const b=m.querySelector('#saSave');

    er.textContent='';
    if(!empresa||!nome||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      er.textContent='Preencha empresa, nome e um e-mail válido.';
      return;
    }
    if(senhaDigitada&&senhaDigitada.length<6){
      er.textContent='A senha inicial deve ter no mínimo 6 caracteres.';
      return;
    }

    b.disabled=true;
    b.textContent='Criando...';

    try{
      const chars='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const senhaAleatoria=Array.from(crypto.getRandomValues(new Uint8Array(20)),x=>chars[x%chars.length]).join('');
      const senhaFinal=senhaDigitada||senhaAleatoria;

      const novoUid=await saCriarContaAuth(email,senhaFinal);
      const dadosPerfil={nome,email,perfil,empresa,ativo:true};

      await fb.db.ref('perfis/'+novoUid).set(dadosPerfil);
      await fb.db.ref('empresas/'+empresa+'/usuarios/'+novoUid).set({...dadosPerfil,id:novoUid});

      const infoSnap=await fb.db.ref('empresas/'+empresa+'/info').get();
      if(!infoSnap.exists()){
        await fb.db.ref('empresas/'+empresa+'/info').set({nome:empresa});
      }

      if(!senhaDigitada){
        try{await fb.auth.sendPasswordResetEmail(email)}catch(e){}
      }

      m.remove();
      toast(senhaDigitada?'Usuário criado com sucesso!':'Usuário criado e e-mail de definição de senha enviado!');
      await saCarregarUsuarios();
    }catch(e){
      er.textContent=e.code==='auth/email-already-in-use'
        ?'Este e-mail já está cadastrado no sistema.'
        :(e.message||'Não foi possível criar o usuário.');
      b.disabled=false;
      b.textContent='Criar usuário';
    }
  };
}

async function saSair(){
  SA={profiles:{},companies:[],user:null,filtro:'',tab:'usuarios',logsEmp:{}};
  try{await fb.auth.signOut()}catch(e){}
  saLoginView();
}

/* ============================================================================
   INICIALIZAÇÃO DA APLICAÇÃO
   ============================================================================ */
(async()=>{
  const page=new URLSearchParams(location.search).get('pagina');
  if(page==='termos'||page==='privacidade'||page==='lgpd')return termsPage(page);
  if(page==='empresa'||location.hash==='#empresa')return companyPage();

  if(isSuperadminRoute()){
    $('#app').innerHTML='<div class="login"><p class="mu">Verificando sessão Superadmin…</p></div>';
    const u=await new Promise(r=>{const o=fb.auth.onAuthStateChanged(x=>{o();r(x)})});
    if(u){
      try{
        const p=(await fb.db.ref('perfis/'+u.uid).get()).val();
        if(p&&p.perfil==='superadmin'&&p.ativo!==false){
          SA.user={uid:u.uid,email:p.email||u.email,nome:p.nome||'Superadmin'};
          return saCarregarUsuarios();
        }
      }catch(e){}
      try{await fb.auth.signOut()}catch(e){}
    }
    return saLoginView();
  }

  $('#app').innerHTML='<div class="login"><p class="mu">Carregando…</p></div>';
  const u=await new Promise(r=>{const o=fb.auth.onAuthStateChanged(x=>{o();r(x)})}),ts=+localStorage.getItem(TS)||0;
  if(u&&ts&&Date.now()-ts>=SESSAO_MIN*60000){await sair();return loginView('Sua sessão expirou após 60 minutos. Entre novamente.')}
  if(u){
    try{
      const r=await montar(u);
      if(r.user){me=r.user;cur='clientes';q='';if(!ts)localStorage.setItem(TS,Date.now());return start()}
    }catch(e){}
    await sair();
  }
  loginView();
})();
